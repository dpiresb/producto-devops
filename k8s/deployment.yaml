apiVersion: apps/v1
kind: Deployment
metadata:
  name: miapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miapp
  template:
    metadata:
      labels:
        app: miapp
    spec:
      containers:
        - name: miapp
          image: miapp:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080